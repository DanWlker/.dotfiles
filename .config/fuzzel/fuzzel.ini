# Catppuccin Mocha (lavender accent to match Hyprland borders)
# https://github.com/catppuccin/fuzzel

[main]
font=Maple Mono NF:size=12
terminal=kitty
# Launch apps as their own systemd units instead of children of fuzzel
launch-prefix=uwsm-app --
width=45
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8

[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=b4befeff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=b4befeff
counter=7f849cff
border=f5e0dcff

[border]
# Match general.border_size and decoration.rounding in hyprland.lua
width=3
radius=12
