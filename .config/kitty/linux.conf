# Linux-only kitty settings, loaded by kitty.conf's `include ${KITTY_OS}.conf`
font_size 11.0
# The login shell here is bash; kitty should start zsh
shell /usr/bin/zsh

# Hyprland's universal copy/paste (Super+C / Super+V) sends Ctrl+Insert / Shift+Insert
map shift+insert paste_from_clipboard
map ctrl+insert copy_to_clipboard
