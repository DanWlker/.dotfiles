# Qt6 theming under Hyprland (QT_QPA_PLATFORMTHEME=hyprqt6engine, set in ~/.config/uwsm/env)
# https://wiki.hypr.land/Hypr-Ecosystem/hyprqt6engine/

theme {
    style = Breeze
    # Full path required (no ~ expansion). From github.com/catppuccin/kde generated/color-schemes
    color_scheme = /home/danielhee/.local/share/color-schemes/CatppuccinMochaLavender.colors
    icon_theme = breeze-dark
    font = Noto Sans
    font_size = 11
    font_fixed = Maple Mono NF
    font_fixed_size = 11
}
